<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    </pattern>

    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.2" fill="rgba(125,231,255,0.26)"/>
      <circle cx="30" cy="24" r="1.0" fill="rgba(190,140,255,0.22)"/>
      <circle cx="42" cy="40" r="0.9" fill="rgba(255,255,255,0.12)"/>
    </pattern>

    <!-- cheap “noise” via many tiny rectangles -->
    <pattern id="noise" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect x="6" y="10" width="1" height="1" fill="rgba(255,255,255,0.08)"/>
      <rect x="18" y="22" width="1" height="1" fill="rgba(255,255,255,0.06)"/>
      <rect x="33" y="14" width="1" height="1" fill="rgba(255,255,255,0.05)"/>
      <rect x="48" y="30" width="1" height="1" fill="rgba(255,255,255,0.07)"/>
      <rect x="12" y="44" width="1" height="1" fill="rgba(255,255,255,0.05)"/>
      <rect x="41" y="51" width="1" height="1" fill="rgba(255,255,255,0.06)"/>
      <rect x="55" y="8" width="1" height="1" fill="rgba(255,255,255,0.05)"/>
      <rect x="26" y="37" width="1" height="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>

  <rect width="240" height="240" fill="url(#grid)"/>
  <rect width="240" height="240" fill="url(#dots)"/>
  <rect width="240" height="240" fill="url(#noise)"/>
</svg>
