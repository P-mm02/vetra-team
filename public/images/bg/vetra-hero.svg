<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1400" viewBox="0 0 2200 1400">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="rgba(125,231,255,0.26)"/>
      <stop offset="1" stop-color="rgba(190,140,255,0.26)"/>
    </linearGradient>

    <filter id="heroGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- big rings -->
  <g fill="none" stroke="url(#hg)" stroke-width="2.2" opacity="0.65" filter="url(#heroGlow)">
    <circle cx="520" cy="460" r="320"/>
    <circle cx="1680" cy="520" r="420"/>
    <circle cx="1220" cy="1080" r="520"/>
  </g>

  <!-- arc strokes -->
  <g fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.6" opacity="0.7">
    <path d="M180 260 C420 60 760 120 940 340"/>
    <path d="M1120 220 C1400 40 1760 120 1940 420"/>
    <path d="M220 1120 C520 860 900 900 1120 1180"/>
    <path d="M1200 1100 C1460 880 1840 900 2060 1160"/>
  </g>

  <!-- focal nodes -->
  <g opacity="0.9">
    <circle cx="820" cy="380" r="5" fill="rgba(125,231,255,0.30)"/>
    <circle cx="1560" cy="420" r="5" fill="rgba(190,140,255,0.28)"/>
    <circle cx="1360" cy="980" r="6" fill="rgba(125,231,255,0.28)"/>
  </g>
</svg>
