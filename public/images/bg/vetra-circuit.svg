<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="rgba(125,231,255,0.22)"/>
      <stop offset="1" stop-color="rgba(190,140,255,0.20)"/>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g fill="none" stroke="url(#cg)" stroke-width="1.2" opacity="0.75" filter="url(#softGlow)">
    <path d="M40 140 H220 V240 H380" />
    <path d="M120 520 H320 V420 H520 V260 H720" />
    <path d="M80 740 H280 V660 H460 V720 H740" />
    <path d="M60 300 H260 V120 H520 V200 H740" />
    <path d="M420 760 V560 H620 V420 H760" />
  </g>

  <g opacity="0.85">
    <circle cx="380" cy="240" r="3" fill="rgba(125,231,255,0.30)"/>
    <circle cx="720" cy="260" r="3" fill="rgba(190,140,255,0.26)"/>
    <circle cx="740" cy="720" r="3" fill="rgba(125,231,255,0.30)"/>
    <circle cx="740" cy="200" r="3" fill="rgba(255,255,255,0.12)"/>
    <circle cx="620" cy="420" r="3" fill="rgba(190,140,255,0.26)"/>
  </g>

  <!-- subtle hex hints -->
  <g fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1" opacity="0.55">
    <path d="M140 240 L190 212 L240 240 L240 300 L190 328 L140 300 Z"/>
    <path d="M520 520 L570 492 L620 520 L620 580 L570 608 L520 580 Z"/>
    <path d="M600 120 L650 92 L700 120 L700 180 L650 208 L600 180 Z"/>
  </g>
</svg>
